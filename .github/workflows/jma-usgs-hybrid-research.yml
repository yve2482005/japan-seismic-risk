name: JMA-USGS research-only hybrid assessment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jma-usgs-hybrid-research
  cancel-in-progress: false
jobs:
  hybrid-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install collector and model dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Assess source-aware JMA-USGS hybrid identifiability
        run: python collector/github_action_runner.py --mode hybrid-research
