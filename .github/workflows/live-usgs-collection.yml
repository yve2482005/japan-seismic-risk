name: Live USGS public CSV collection

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-usgs-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Collect permitted USGS public CSV and update live dataset
        run: python collector/github_action_runner.py --mode collect
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install background notification sender
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Deliver deduplicated opt-in browser push notifications
        env:
          PUSH_DELIVERY_URL: https://japanseismic-269jnxjv.manus.space/api/internal/push-delivery
        run: |
          token_json="$(curl --fail-with-body -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=japan-seismic-push")"
          token="$(node scripts/extract-oidc-token.mjs "$token_json")"
          curl --fail-with-body -sS -X POST "$PUSH_DELIVERY_URL" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{}'
