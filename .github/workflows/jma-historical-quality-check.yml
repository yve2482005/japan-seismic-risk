name: JMA historical source-separated quality check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jma-historical-quality-check
  cancel-in-progress: false

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install collector and model dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Verify JMA-only data quality without reimporting archives or training a model
        run: python collector/github_action_runner.py --mode jma-quality-check
